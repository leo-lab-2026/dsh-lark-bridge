# TEMPORARY diagnostic workflow — prints the OIDC claims and the npmjs
# token-exchange response so a trusted-publishing mismatch can be pinned
# down. Delete after diagnosis.
name: oidc-debug

on:
  workflow_dispatch:

permissions:
  id-token: write

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch OIDC token and decode claims
        run: |
          IDTOKEN=$(curl -s -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm:registry.npmjs.org" | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>console.log(JSON.parse(d).value))")
          echo "$IDTOKEN" > /tmp/idtoken.jwt
          echo "=== OIDC claims ==="
          node -e "
            const p = require('fs').readFileSync('/tmp/idtoken.jwt', 'utf8').split('.')[1]
            const j = JSON.parse(Buffer.from(p.replace(/-/g,'+').replace(/_/g,'/') + '==', 'base64').toString('utf8'))
            console.log(JSON.stringify({
              iss: j.iss, sub: j.sub, repository: j.repository,
              repository_visibility: j.repository_visibility,
              workflow_ref: j.workflow_ref, job_workflow_ref: j.job_workflow_ref,
              environment: j.environment, event_name: j.event_name,
              ref: j.ref, ref_type: j.ref_type, actor: j.actor,
            }, null, 2))
          "
      - name: Call the npmjs OIDC token exchange
        run: |
          IDTOKEN=$(cat /tmp/idtoken.jwt)
          echo "=== exchange endpoint ==="
          curl -s -o /tmp/exchange.json -w "HTTP %{http_code}\n" \
            -X POST "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/dsh-lark-bridge" \
            -H "Authorization: Bearer $IDTOKEN" -H "Content-Type: application/json"
          echo "=== exchange response (token value redacted) ==="
          node -e "
            const d = require('fs').readFileSync('/tmp/exchange.json', 'utf8')
            try {
              const j = JSON.parse(d)
              console.log('keys:', Object.keys(j).join(', '))
              if (j.token) console.log('token: <present, length ' + String(j.token).length + '>')
              if (j.error) console.log('error:', JSON.stringify(j.error).slice(0, 500))
              if (j.message) console.log('message:', String(j.message).slice(0, 500))
            } catch {
              console.log('non-JSON body, first 300 chars:', d.slice(0, 300))
            }
          "
      - name: Inspect npmrc auth state
        run: |
          echo "=== npmrc files ==="
          ls -la ~/.npmrc "$RUNNER_TEMP"/.npmrc 2>/dev/null || true
          echo "=== ~/.npmrc (tokens redacted) ==="
          sed -E 's/(_authToken=).*/\1<redacted>/; s/(_password=).*/\1<redacted>/' ~/.npmrc 2>/dev/null || echo "(no ~/.npmrc)"
          echo "=== effective auth token presence ==="
          T=$(npm config get //registry.npmjs.org/:_authToken 2>/dev/null)
          if [ -n "$T" ]; then echo "token present (length ${#T})"; else echo "no token configured"; fi
