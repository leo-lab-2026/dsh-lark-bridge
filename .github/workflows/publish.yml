# Publish on version tags (`v0.1.0`, ...): runs the full quality gate, then
# publishes the prebuilt tarball to npmjs and attaches it to a GitHub Release.
#
# Provenance policy:
# - While the `NPM_TOKEN` secret exists, npm authenticates with it and skips
#   provenance (npm requires a package to exist before a trusted publisher
#   can be configured).
# - After the first release, configure trusted publishing for this workflow
#   (npm trust publishing --workflow publish.yml --project <owner>/<repo>),
#   delete the NPM_TOKEN secret, and re-run: publish then uses GitHub OIDC
#   with --provenance and no stored token.
#
# The `latest` dist-tag must only ever carry stable versions: publish
# prereleases (0.x.0-beta.N) with `npm publish --tag next`, not with this
# workflow's default tag.
name: publish

on:
  push:
    tags: ['v*']

permissions:
  contents: write # GitHub Release creation (gh release create)
  id-token: write # npm provenance via GitHub OIDC

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # Pinned to the harness commit this plugin was developed and tested
      # against (public master HEAD at release time). Bump it together with
      # the local `../deepseek-harness` checkout when developing against a
      # newer harness, then re-verify the full gate locally.
      - uses: actions/checkout@v4
        with:
          repository: deepseek-ai/deepseek-harness
          ref: 47f943859bef60e4160492346772ded9b24f765a
          path: deepseek-harness

      - uses: actions/checkout@v4
        with:
          path: dsh-lark-bridge

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: deepseek-harness/pnpm-lock.yaml
          registry-url: https://registry.npmjs.org/

      - name: Install and build the harness checkout
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
        working-directory: deepseek-harness

      - name: Install plugin dependencies
        run: pnpm install --frozen-lockfile
        working-directory: dsh-lark-bridge

      - name: Quality gate (typecheck + tests; prepack builds lib/)
        run: |
          pnpm typecheck
          pnpm test
        working-directory: dsh-lark-bridge

      - name: Publish to npmjs (skips versions already on the registry)
        working-directory: dsh-lark-bridge
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if npm view "dsh-lark-bridge@${version}" version >/dev/null 2>&1; then
            echo "dsh-lark-bridge@${version} is already published — skipping npm publish"
          elif [ -n "$NODE_AUTH_TOKEN" ]; then
            npm publish --registry=https://registry.npmjs.org/ --access public
          else
            npm publish --registry=https://registry.npmjs.org/ --access public --provenance
          fi

      - name: Pack tarball for the release asset
        run: pnpm pack --pack-destination dist
        working-directory: dsh-lark-bridge

      - name: Create GitHub release with the tarball asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "dsh-lark-bridge $GITHUB_REF_NAME" \
            --notes "See [CHANGELOG.md](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/CHANGELOG.md)." \
            dsh-lark-bridge/dist/*.tgz
