# Publish on version tags (`v0.1.0`, `v0.1.1-beta.0`, ...): runs the full
# quality gate, then publishes the prebuilt tarball to npmjs and attaches it
# to a GitHub Release.
#
# Authentication is npm trusted publishing: npmjs trusts THIS repository +
# workflow through GitHub OIDC (configured with `npm trust github`), so no
# npm token is stored anywhere. The `--provenance` flag attaches SLSA build
# provenance to every published version.
#
# Dist-tags: prereleases (v*-beta.*/v*-rc.*/v*-pre.*/v*-dev.*) publish under
# `next`; `latest` only ever carries stable versions.
# Re-running a tag whose version already exists skips the publish (idempotent)
# and only refreshes the GitHub Release.
name: publish

on:
  push:
    tags: ['v*']

permissions:
  contents: write # GitHub Release creation (gh release create)
  id-token: write # npm provenance via GitHub OIDC

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # Pinned to the harness commit this plugin was developed and tested
      # against (public master HEAD at release time). Bump it together with
      # the local `../deepseek-harness` checkout when developing against a
      # newer harness, then re-verify the full gate locally.
      - uses: actions/checkout@v4
        with:
          repository: deepseek-ai/deepseek-harness
          ref: 47f943859bef60e4160492346772ded9b24f765a
          path: deepseek-harness

      - uses: actions/checkout@v4
        with:
          path: dsh-lark-bridge

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      # Node 24 is required: npm trusted publishing (OIDC) needs npm ≥ 11.5.1,
      # and only Node 24+ bundles npm 11. Node 22 bundles npm 10, which falls
      # back to token auth (setup-node's dummy sentinel token) and 404s.
      # No registry-url here: with no real NODE_AUTH_TOKEN, setup-node writes a
      # placeholder auth token that defeats the OIDC flow.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: deepseek-harness/pnpm-lock.yaml

      - name: Install and build the harness checkout
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
        working-directory: deepseek-harness

      - name: Install plugin dependencies
        run: pnpm install --frozen-lockfile
        working-directory: dsh-lark-bridge

      - name: Quality gate (typecheck + tests; prepack builds lib/)
        run: |
          pnpm typecheck
          pnpm test
        working-directory: dsh-lark-bridge

      - name: Publish to npmjs (OIDC trusted publishing; skips versions already on the registry)
        working-directory: dsh-lark-bridge
        run: |
          version="$(node -p "require('./package.json').version")"
          if npm view "dsh-lark-bridge@${version}" version >/dev/null 2>&1; then
            echo "dsh-lark-bridge@${version} is already published — skipping npm publish"
            exit 0
          fi
          # Prereleases (x.y.z-beta.N / x.y.z-rc.N) go under `next`; the
          # `latest` dist-tag must only ever carry stable versions.
          case "$GITHUB_REF_NAME" in
            *-beta.*|*-rc.*|*-pre.*|*-dev.*) tag="--tag next" ;;
            *) tag="" ;;
          esac
          npm publish --registry=https://registry.npmjs.org/ --access public --provenance $tag

      - name: Pack tarball for the release asset
        run: pnpm pack --pack-destination dist
        working-directory: dsh-lark-bridge

      - name: Create GitHub release with the tarball asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "dsh-lark-bridge $GITHUB_REF_NAME" \
            --notes "See [CHANGELOG.md](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/CHANGELOG.md)." \
            dsh-lark-bridge/dist/*.tgz
